# EXAMPLE ONLY — do not commit real secrets. Create the real Secret out-of-band
# (sealed-secrets, external-secrets, or `kubectl create secret`), never in git.
#
#   kubectl create secret generic mlfa-secrets \
#     --from-literal=MLFA_API_KEY='<strong-random-key>' \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://user:pass@your-postgres:5432/mlfa' \
#     --from-literal=REDIS_URL='redis://your-redis:6379/0'
apiVersion: v1
kind: Secret
metadata:
  name: mlfa-secrets
type: Opaque
stringData:
  MLFA_API_KEY: "CHANGE_ME"
  DATABASE_URL: "postgresql+psycopg2://user:CHANGE_ME@postgres:5432/mlfa"
  REDIS_URL: "redis://redis:6379/0"
