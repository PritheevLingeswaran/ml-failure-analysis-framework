apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlfa

# secret.example.yaml is intentionally NOT included — create the real Secret
# out-of-band (sealed-secrets / external-secrets / kubectl create secret).
resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

# Pin the image once here; overlays can patch newTag per environment.
images:
  - name: mlfa
    newName: ghcr.io/pritheevlingeswaran/ml-failure-analysis-framework
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: mlfa
      app.kubernetes.io/part-of: ml-failure-analysis-framework
