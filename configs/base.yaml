app:
  name: ml-failure-analysis-framework
  env: dev

paths:
  data_raw: data/raw/datasets/sample.csv
  data_processed_dir: data/processed
  outputs_dir: outputs

data:
  # How the raw CSV at paths.data_raw is produced by scripts/prepare_data.py:
  #   synthetic              -> generated demo data (text/region/amount/time)
  #   sklearn_breast_cancer  -> a real, bundled dataset (30 numeric measurements)
  # To use your OWN data, point paths.data_raw at your CSV and skip prepare_data.
  source: synthetic
  dataset:
    type: csv_classification
    label_col: label
    id_col: id
    text_col: text          # optional, used for automatic slices + error examples
    time_col: event_time    # optional, used for temporal split strategy
  split:
    seed: 42
    test_size: 0.2
    val_size: 0.1           # fraction of remaining after test split
    strategy: random        # one of: random, time
    time_col: event_time

models:
  registry:
    - name: logreg
      type: sklearn_logreg
      params:
        C: 1.0
        max_iter: 1000
    - name: rf
      type: sklearn_random_forest
      params:
        n_estimators: 300
        max_depth: null
        random_state: 42
    - name: xgb
      type: xgboost_classifier
      enabled: false         # set true if you have xgboost installed
      params:
        n_estimators: 400
        max_depth: 6
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42

evaluation:
  task: classification
  positive_label: 1          # used for binary cost evaluation
  threshold_grid:
    start: 0.05
    stop: 0.95
    step: 0.01
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
    - brier
    - ece
  calibration:
    n_bins: 10
    method: platt            # one of: none, platt, isotonic
  confidence_metrics:
    high_confidence_threshold: 0.8
  instability:
    min_count: 50
    bootstrap_iters: 200
    ci_alpha: 0.05

evaluation_quality:
  slice_drop_threshold: 0.35
  slice_cost_increase_threshold: 0.20
  baseline_threshold: 0.5

slicing:
  slices_config: configs/slices.yaml
  auto_slices:
    enabled: true
    text_length_bins: [0, 30, 80, 160, 1000000]   # characters
    confidence_bins: [0.0, 0.5, 0.7, 0.85, 1.01]
    label_freq_bins: [0.0, 0.01, 0.05, 0.2, 1.01] # relative frequency
    difficulty:
      enabled: true
      method: ensemble_disagreement    # simple + robust: disagree => "hard"
    risky_discovery:
      enabled: true
      min_count: 50
      min_error_lift: 0.05
      max_cardinality: 15
      top_k: 10
    fairness:
      enabled: true
      protected_columns: ["region"]

decision:
  costs_config: configs/decision_costs.yaml
  default_use_case: fraud_strict
  optimize_threshold: true
  per_slice_optimization: true

visualization:
  enabled: true
  max_slices_heatmap: 25

api:
  host: 0.0.0.0
  port: 8000
  reload: true
  cache_ttl_sec: 180
  # CORS: origins allowed to call the API directly from a browser.
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  # Optional API-key auth. null = open (dev). Set a string, or the MLFA_API_KEY
  # env var, to require an `X-API-Key` header on all data endpoints.
  api_key: null

advanced:
  drift:
    psi_warn: 0.2
    tv_warn: 0.2
  cost_sensitivity:
    fp_multipliers: [0.5, 1.0, 1.5, 2.0]
    fn_multipliers: [0.5, 1.0, 1.5, 2.0]
  model_stack:
    ensemble_avg:
      enabled: true
