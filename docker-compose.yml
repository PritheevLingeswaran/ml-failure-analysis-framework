services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - CONFIG_PATH=configs/prod.yaml
      # Prod requires an API key or the app refuses to start. Provide it via a
      # .env file or your shell: `MLFA_API_KEY=... docker compose up`.
      - MLFA_API_KEY=${MLFA_API_KEY:?MLFA_API_KEY must be set for prod}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-120/minute}
    volumes:
      - ./outputs:/app/outputs
